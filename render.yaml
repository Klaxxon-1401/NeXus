databases:
  - name: sigma-investments-demo-db
    plan: free
    databaseName: sigma_demo
    user: sigma_demo

services:
  - type: web
    name: sigma-investments-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: flask --app run.py init-db --seed && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-investments-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
